{% if errors %}
<div class="alert alert-danger feedback-message" role="alert" tabindex="-1" data-error-summary>
    <h2 class="h6">Please check the following:</h2>
    <p>Your changes have not been saved. Review the messages and correct the form.</p>
    <ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
</div>
{% endif %}
